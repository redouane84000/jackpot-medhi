<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jackpot Medhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,700..900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Jeu plein écran : la 3D occupe tout, l'interface tient sur les bords. Un seul univers visuel sombre, assumé. */
:root{
  --ink:#eef3f6; --dim:#93a4ae; --panel:rgba(7,12,17,.78); --rule:rgba(238,243,246,.16);
  --blue:#2c6bff; --blue-2:#7aa9ff; --orange:#ff6a12; --orange-2:#ffa25c; --gold:#f2c14e; --gold-2:#ffe08f; --bad:#ff6b5e;
  --f-display:"Archivo","Arial Narrow",Impact,system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#0a1015;color:var(--ink);font-family:var(--f-display);overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button,#ui label,#ui input,.touch *{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* Tableau de score */
.score{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:stretch;font-variant-numeric:tabular-nums;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35))}
.team{display:flex;align-items:center;gap:12px;background:var(--panel);padding:0 14px;height:48px;border-bottom:3px solid}
.team.blue{border-color:var(--blue)} .team.orange{border-color:var(--orange)}
.team .name{font-size:12px;font-weight:700;font-stretch:110%;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.team .pts{font-size:34px;font-weight:900;font-stretch:80%;min-width:1ch;text-align:center}
.team.blue .pts{color:var(--blue-2)} .team.orange .pts{color:var(--orange-2)}
.clock{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:104px;background:#04080b;border-bottom:3px solid var(--gold);padding:0 14px}
.clock span:first-child{font-size:26px;font-weight:800;font-stretch:85%}
.clock .ot{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-top:-2px}

/* Jauge de boost */
.boost{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:124px;height:124px;display:grid;place-items:center}
.boost svg{position:absolute;inset:0;transform:rotate(-90deg)}
.boost circle{fill:none;stroke-width:9}
.boost .track{stroke:rgba(255,255,255,.12)}
.boost .fill{stroke:var(--gold);stroke-linecap:butt;transition:stroke-dashoffset .12s linear}
.boost.active .fill{stroke:var(--gold-2);filter:drop-shadow(0 0 6px rgba(242,193,78,.8))}
.boost.empty .bval{opacity:.45}
.boost .bval{display:flex;flex-direction:column;align-items:center;line-height:1;font-variant-numeric:tabular-nums}
.boost .bval span{font-size:40px;font-weight:900;font-stretch:78%}
.boost .bval small{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.boost .speed{position:absolute;right:calc(100% + 14px);bottom:10px;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em;white-space:nowrap}
.boost .speed span{font-size:22px;font-weight:800;font-stretch:85%;color:var(--ink)}
.hint{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:12px;color:rgba(238,243,246,.55);letter-spacing:.06em}
.toast{position:absolute;top:calc(76px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;border-left:3px solid var(--gold)}

/* Annonces animées */
.center{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.ann{grid-area:1/1;display:grid;place-items:center;width:100%}
.ann.count span{font-size:clamp(120px,22vw,300px);font-weight:900;font-stretch:72%;line-height:1;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.45);animation:count .95s cubic-bezier(.2,.8,.2,1) both}
.ann.count.go span{color:var(--gold);font-stretch:125%;font-style:italic;text-transform:uppercase}
@keyframes count{0%{opacity:0;transform:scale(1.7);filter:blur(8px)}18%{opacity:1;transform:scale(1);filter:blur(0)}72%{opacity:1;transform:scale(.94)}100%{opacity:0;transform:scale(.8)}}
.ann.goal .band{width:120%;transform:skewY(-6deg);display:flex;flex-direction:column;align-items:center;padding:clamp(14px,3vw,30px) 0;animation:band 2.9s cubic-bezier(.7,0,.2,1) both}
.ann.goal .band.blue{background:linear-gradient(90deg,transparent,rgba(44,107,255,.92) 20%,rgba(44,107,255,.92) 80%,transparent)}
.ann.goal .band.orange{background:linear-gradient(90deg,transparent,rgba(255,106,18,.92) 20%,rgba(255,106,18,.92) 80%,transparent)}
.ann.goal .band.gold{background:linear-gradient(90deg,transparent,rgba(160,112,10,.92) 20%,rgba(160,112,10,.92) 80%,transparent)}
.ann.goal .big{display:block;transform:skewY(6deg);font-size:clamp(70px,13vw,190px);font-weight:900;font-stretch:125%;font-style:italic;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.3)}
.ann.goal .sub{display:block;transform:skewY(6deg);margin-top:8px;font-size:clamp(13px,1.6vw,18px);letter-spacing:.24em;text-transform:uppercase;font-weight:700}
@keyframes band{0%{opacity:0;clip-path:inset(0 100% 0 0)}12%{opacity:1;clip-path:inset(0 0 0 0)}82%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}
.flash{position:absolute;inset:0;opacity:0}
.flash.blue{background:radial-gradient(circle at 50% 45%,rgba(122,169,255,.55),rgba(44,107,255,.18) 35%,transparent 70%)}
.flash.orange{background:radial-gradient(circle at 50% 45%,rgba(255,170,100,.55),rgba(255,106,18,.18) 35%,transparent 70%)}
.flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}

/* Menus */
.menu{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:32px;padding:calc(32px + env(safe-area-inset-top,0px)) clamp(16px,5vw,72px) calc(32px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,rgba(4,8,12,.9) 0%,rgba(4,8,12,.66) 34%,rgba(4,8,12,0) 58%),linear-gradient(0deg,rgba(4,8,12,.55),transparent 35%)}
.menu-col{max-width:560px;display:flex;flex-direction:column;gap:16px;align-self:center;max-height:100%;overflow:auto;scrollbar-width:none}
.menu .title{font-size:clamp(48px,7.2vw,104px)}
.cars{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cars legend{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;padding:0}
.car{position:relative;display:block}
.car input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.car .card{display:flex;flex-direction:column;gap:6px;padding:12px 14px 14px;border:1px solid var(--rule);background:rgba(7,12,17,.55);transition:border-color .2s,background .2s,transform .2s}
.car input:checked+.card{border-color:var(--gold);background:rgba(242,193,78,.1);box-shadow:inset 0 -3px 0 var(--gold)}
.car:hover .card{transform:translateY(-2px)}
.car input:focus-visible+.card{outline:2px solid var(--gold);outline-offset:3px}
.car .ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.car .cn{font-size:19px;font-weight:900;font-stretch:115%;text-transform:uppercase;letter-spacing:.02em}
.car .tag{font-family:var(--f-mono);font-size:10.5px;color:var(--gold);border:1px solid rgba(242,193,78,.5);padding:1px 6px;white-space:nowrap}
.car .ce{font-size:12px;color:#cfd9de;line-height:1.35}
.car .bars{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;font-size:10.5px;letter-spacing:.06em;color:var(--dim);margin-top:2px}
.car .bars i{height:4px;background:rgba(255,255,255,.12);position:relative}
.car .bars i::after{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--v) * 100%);background:var(--ink)}
.car input:checked+.card .bars i::after{background:var(--gold)}
.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.ghost{background:transparent;border:1px solid var(--rule);padding:0 22px;font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.ghost:hover{border-color:var(--ink)}
.menu-keys{position:absolute;right:clamp(16px,5vw,72px);bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.showcase{position:absolute;right:clamp(16px,5vw,72px);top:calc(36px + env(safe-area-inset-top,0px));text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:42vw}
.showcase .sn{font-size:clamp(34px,5vw,72px);font-weight:900;font-stretch:125%;font-style:italic;text-transform:uppercase;line-height:.9;letter-spacing:-.01em;text-shadow:0 8px 30px rgba(0,0,0,.5)}
.showcase .se{font-size:14px;color:#cfd9de;letter-spacing:.04em;max-width:34ch}
.showcase.in .sn{animation:scIn .7s cubic-bezier(.2,.8,.2,1) both}
.showcase.in .se{animation:scIn .7s .12s cubic-bezier(.2,.8,.2,1) both}
@keyframes scIn{0%{opacity:0;transform:translateX(40px);filter:blur(6px)}100%{opacity:1;transform:none;filter:none}}
.eyebrow{margin:0;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);font-weight:700}
.title{margin:0;display:flex;flex-direction:column;font-size:clamp(58px,9.5vw,140px);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.84;letter-spacing:-.015em}
.title span:last-child{color:var(--gold)}
.lede{margin:0;font-size:17px;line-height:1.55;color:#cfd9de;max-width:46ch}
.tb{color:var(--blue-2)} .to{color:var(--orange-2)}
.diff{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0}
.diff legend{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;padding:0}
.diff label{position:relative}
.diff input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.diff span{display:block;padding:10px 18px;border:1px solid var(--rule);margin-right:-1px;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.diff input:checked+span{background:var(--ink);color:#05090c;border-color:var(--ink)}
.primary{align-self:flex-start;background:var(--gold);color:#140d00;border:0;padding:16px 46px;font-size:18px;font-weight:900;font-stretch:115%;letter-spacing:.1em;text-transform:uppercase;transition:transform .15s,background .15s}
.primary:hover{background:var(--gold-2);transform:translateY(-2px)}
.foot{margin:0;font-size:13px;color:var(--dim)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;align-items:center;font-size:13px;color:#cfd9de;background:var(--panel);padding:18px 20px;border-top:3px solid var(--gold);max-width:420px}
.keys div{display:contents}
kbd{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--rule);padding:3px 7px;white-space:nowrap;justify-self:start}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;background:rgba(4,8,12,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center}
.overlay h2{margin:0;font-size:clamp(48px,8vw,96px);font-weight:900;font-stretch:125%;text-transform:uppercase;line-height:.9}
.overlay .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.overlay .btns button:not(.primary){background:transparent;border:1px solid var(--rule);padding:15px 26px;font-size:15px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.overlay .btns button:not(.primary):hover{border-color:var(--ink)}
.keys.compact{max-width:520px;text-align:left}
.end[data-result=win] h2{color:var(--gold)} .end[data-result=lose] h2{color:#c5d0d6}
.final{margin:0;font-size:clamp(20px,3vw,30px);font-weight:800;font-stretch:90%;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.final .sep{color:var(--dim);margin:0 .4em}

/* Chargement */
.loading,#boot{position:fixed;inset:0;display:grid;place-items:center;background:#070b0f;color:var(--dim);font-size:13px;letter-spacing:.24em;text-transform:uppercase;z-index:5;transition:opacity .6s;text-align:center;padding:0 24px}
.loading.off{opacity:0;pointer-events:none}
.loading.err,#boot.err{color:var(--bad);letter-spacing:.04em;text-transform:none;font-size:16px;line-height:1.5}

/* Commandes tactiles */
.touch{position:fixed;inset:0;pointer-events:none;z-index:3}
.ui-overlay .touch{display:none}
.stick{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,.25);background:rgba(7,12,17,.35);pointer-events:auto;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:rgba(238,243,246,.85)}
.tbtns{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,76px);gap:12px;pointer-events:auto}
.tbtns button{height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(7,12,17,.5);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;touch-action:none}
.tbtns #tJump{grid-column:2;grid-row:1 / span 2;height:auto;background:rgba(242,193,78,.85);color:#140d00}
.tbtns button.on{background:var(--ink);color:#05090c}
@media (pointer:coarse){ .boost{top:calc(70px + env(safe-area-inset-top,0px));bottom:auto;width:96px;height:96px} .boost .bval span{font-size:30px} .hint{display:none} }

.dev{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:12px;margin:0;font-family:var(--f-mono);font-size:11.5px;line-height:1.5;background:rgba(0,0,0,.72);padding:10px 12px;color:#bfe3c6;white-space:pre}

@media (max-width:820px){
  .menu{grid-template-columns:1fr;align-content:center;background:rgba(4,8,12,.78);overflow:auto;pointer-events:auto}
  .menu .keys{display:none} .showcase{display:none} .cars{grid-template-columns:1fr}
  .team{padding:0 10px;height:42px} .team .name{display:none} .team .pts{font-size:28px} .clock{min-width:84px} .clock span:first-child{font-size:22px}
}
@media (prefers-reduced-motion:reduce){ .ann.count span,.ann.goal .band,.flash.on{animation-duration:.01s} .primary{transition:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="Arène 3D de football automobile"></canvas>
<div id="ui"></div>
<div id="boot">Chargement de l’arène</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
